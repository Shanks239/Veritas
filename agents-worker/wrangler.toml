name = "veritas-agents"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# No cron, no KV, no secrets — this Worker only answers /predict requests.
# Each agent's prediction is pure computation over the request payload.

# Roster: name → { strategy, on-chain address }. Addresses are public.
# Regenerate this block after `npm run setup -- gen` with:
#   cd ../agent-test && npm run setup -- worker-config
[vars]
