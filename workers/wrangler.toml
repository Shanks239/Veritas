name = "veritas-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron runs every minute. Worker checks which phase each active window is in.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "a1671fd8686a42869f19620384922e6f"

[vars]
SUI_NETWORK         = "testnet"
PACKAGE_ID          = "0xaf7137f72e7f44e7eabc8b3975da5f315085365696470fe7d1f8ff373f63d5d2"
MARKET_CONFIG_ID    = "0x2b0a384a0f78f4e6360644107e9dfa69706a95e4da9beb2080a55f026d6cd044"
REGISTRY_ID         = "0x54f5e69e3981ccaf1081e495ef7e8e8696dc96993bb7e9c3ea598760b77b4f10"
BALANCE_MANAGER_ID  = "0x1955e671455167563b6737b1a12e5ae9272279bad07d052e5e631dedf3cf3974"

# Set these via: wrangler secret put <NAME>
# SUI_PRIVATE_KEY   — base64 Ed25519 private key for Worker signing + admin ops
# COINGECKO_API_KEY — CoinGecko Pro API key for price feeds
# SALT_SECRET       — arbitrary secret string for deterministic zkLogin salt derivation
# GOOGLE_CLIENT_ID  — Google OAuth app client ID (for zkLogin auth flow)
