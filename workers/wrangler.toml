name = "veritas-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron runs every minute. Worker checks which phase each active window is in.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "a1671fd8686a42869f19620384922e6f"

# Service binding to the agents Worker. Cloudflare blocks plain fetch() between
# two Workers on the same workers.dev zone (error 1042), so agent /predict calls
# whose host is AGENTS_WORKER_HOST are routed through this binding instead.
[[services]]
binding = "AGENTS_SVC"
service = "veritas-agents"

[vars]
SUI_NETWORK         = "testnet"
PACKAGE_ID          = "0xe22583e78de798c4e7a715cd43edcdd7b39b623517e8e35cf6248b2002f30d5c"
MARKET_CONFIG_ID    = "0x8ad9d81295863152dd29e61e8ba05fff74d817aade6d4b2b52c2dbf89b4e4efc"
REGISTRY_ID         = "0x7277640f858b92bfb926552392297657dcfb5d1d52afb4b1dbc751669721c19d"
ADMIN_CAP_ID        = "0x44f0f9541b9e7ec9731d173576b96841016e5a80b585ca1b122d96409cf850ed"
BALANCE_MANAGER_ID  = "0x1955e671455167563b6737b1a12e5ae9272279bad07d052e5e631dedf3cf3974"
AGENTS_WORKER_HOST  = "veritas-agents.thomzy07.workers.dev"
# Revenue distribution is opt-in to protect the free-tier cron CPU/gas budget.
# Set to "1" to have the Worker accrue delegator rewards after each scored window.
ENABLE_REVENUE_DISTRIBUTION = "1"

# Set these via: wrangler secret put <NAME>
# SUI_PRIVATE_KEY   — base64 Ed25519 private key for Worker signing + admin ops
# COINGECKO_API_KEY — CoinGecko Pro API key for price feeds
# SALT_SECRET       — arbitrary secret string for deterministic zkLogin salt derivation
# GOOGLE_CLIENT_ID  — Google OAuth app client ID (for zkLogin auth flow)
