name = "veritas-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron runs every minute. Worker checks which phase each active window is in.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[vars]
SUI_NETWORK      = "testnet"
PACKAGE_ID       = "REPLACE_AFTER_DEPLOY"
MARKET_CONFIG_ID = "REPLACE_AFTER_DEPLOY"
REGISTRY_ID      = "REPLACE_AFTER_DEPLOY"

# Set these via: wrangler secret put <NAME>
# SUI_PRIVATE_KEY  — base64 Ed25519 private key for Worker signing + admin ops
# COINGECKO_API_KEY
